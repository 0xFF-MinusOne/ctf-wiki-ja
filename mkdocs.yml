site_name: CTF Wiki 日本語訳(Pwn・Reverse・Executable)
site_description: CTF Wiki の Pwn・Reverse・Executable の日本語訳
site_url: https://0xff-minusone.github.io/ctf-wiki-ja/
repo_url: https://github.com/0xff-minusone/ctf-wiki-ja
repo_name: 0xff-minusone/ctf-wiki-ja
docs_dir: .site-src
site_dir: site
copyright: >-
  日本語訳(簡体字中国語から翻訳、原文から変更あり)。
  原著: <a href="https://github.com/ctf-wiki/ctf-wiki">ctf-wiki/ctf-wiki</a>(<a href="https://ctf-wiki.org">ctf-wiki.org</a>)。
  ライセンス: <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/deed.ja">CC BY-NC-SA 4.0</a>(非営利の目的でのみ利用できます)。

theme:
  name: material
  language: ja
  features:
    - navigation.tabs
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: ダークモードに切り替え
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: ライトモードに切り替え

plugins:
  - search:
      lang: ja

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ctf-wiki/ctf-wiki
      name: 原著(ctf-wiki/ctf-wiki)

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.arithmatex:
      generic: true
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.js

